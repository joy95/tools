[tool.poetry]
name = "media-tools-backend"
version = "0.1.0"
description = "FastAPI backend for media tools mini-program"
authors = ["media-tools"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
python-multipart = "^0.0.9"
sqlmodel = "^0.0.19"
celery = "^5.4.0"
redis = "^5.0.4"
pydantic-settings = "^2.2.1"
requests = "^2.32.0"
beautifulsoup4 = "^4.12.3"
lxml = "^5.2.1"
numpy = ">=1.24,<2"
pillow = "^10.3.0"
moviepy = "^1.0.3"
rapidocr-onnxruntime = "^1.4.4"
yt-dlp = "^2026.3.17"
faster-whisper = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
httpx = "^0.27.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
