[tool.poetry]
name = "self-media-backend"
version = "0.1.0"
description = "Backend for self-media toolkit mini-app"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
python-multipart = "^0.0.9"
celery = "^5.3.6"
redis = "^5.0.1"
opencv-python = "^4.9.0.80"
Pillow = "^10.2.0"
paddlepaddle = "^2.6.0" # PaddleOCR 依赖
paddleocr = "^2.7.0" # PaddleOCR 库
moviepy = "^1.0.3"
gTTS = "^1.2.2"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.3"
lxml = "^5.1.0"
httpx = "^0.27.0" # FastAPI 异步请求客户端
asyncio = "^3.4.3" # 异步支持

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
